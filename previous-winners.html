  <script>
    (function () {
      var isStandalone =
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;
      var alreadyShown = sessionStorage.getItem("appSplashShown") === "1";
      var splash = document.getElementById("appSplash");
      if (!isStandalone || alreadyShown) {
        splash.remove();
      } else {
        sessionStorage.setItem("appSplashShown", "1");
        setTimeout(function () {
          splash.classList.add("app-splash-hide");
          setTimeout(function () {
            splash.remove();
          }, 400);
        }, 1500);
      }
    })();
  </script>
